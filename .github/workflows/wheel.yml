name: Build, Test & Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # build only, nothing is published

jobs:
  build_wheels:
    # Every job builds the wheels of all supported CPython versions
    # (cp39 - cp314, incl. the free-threaded cp313t & cp314t), see
    # `requires-python` in pyproject.toml.
    name: Build wheels for ${{ matrix.platform_id }} ${{ matrix.manylinux_image }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform_id: win_amd64
          - os: ubuntu-latest
            platform_id: manylinux_x86_64
            manylinux_image: manylinux2014
          - os: ubuntu-latest
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-24.04-arm
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
          - os: macos-15-intel
            macos_target: 15
            platform_id: macosx_x86_64
          - os: macos-15
            macos_target: 15
            platform_id: macosx_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Provide gfortran (Windows)
        uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          update: true
          cache: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-gcc-fortran
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - run: pipx run --python 3.13 cibuildwheel==3.1.1
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CIBW_ARCHS: all
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND_WINDOWS: ""
          CIBW_ENABLE: cpython-freethreading
          CIBW_BUILD: cp*-${{ matrix.platform_id }}
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_INDEX: https://pypi.org/simple
      - run: |
          mv wheelhouse dist
          pipx run --python 3.13 delvewheel==1.10 repair dist/*.whl -vv
        if: runner.os == 'Windows'
        shell: msys2 {0}
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        if: runner.os == 'macOS'
        with:
          compiler: gcc
          version: latest
      - uses: pypa/cibuildwheel@v3.1.1
        if: runner.os != 'Windows'
        env:
          CIBW_ARCHS: all
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_MACOS: FC=gfortran
          CIBW_ENABLE: cpython-freethreading
          CIBW_BEFORE_ALL_LINUX: "yum install -y openblas-devel"
          CIBW_BEFORE_ALL_MACOS: "brew install openblas gfortran"
          CIBW_BUILD: cp*-${{ matrix.platform_id }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_image }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}.0
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_INDEX: https://pypi.org/simple
      - run: ls -l wheelhouse/*
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.platform_id }}${{ matrix.manylinux_image }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  convert_wheel_2_conda_and_publish:
    needs: [build_wheels]
    runs-on: macos-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true
      - run: |
          # install dependencies
          brew install -y python rattler-build pipx;
          pipx install whl2conda;
          # convert wheels to conda packages
          for wheel in dist/*.whl; do
            pipx run whl2conda    \
              convert   ${wheel}  \
              --out-dir conda-dist;
          done
          # list them out for inspection
          echo '==================================='
          ls -l conda-dist/*
          echo '==================================='
      - uses: mamba-org/setup-micromamba@v2
        with:
          create-args: >-
            anaconda-client
            conda-verify
            conda-build
            numpy
      - run: |
          conda config --set anaconda_upload yes
          for file in conda-dist/*; do
            anaconda upload $file -c conda-forge
          done
        shell: micromamba-shell {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
